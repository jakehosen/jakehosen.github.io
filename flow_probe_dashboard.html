<style>
  :root {
    color-scheme: dark;
    --bg: #0e1621;
    --panel: #16212e;
    --grid: #26364a;
    --ink: #dbe6f0;
    --mute: #7b8fa6;
    --heat: #ff5c39;

  body {

    background: var(--panel); color: var(--ink); border: 1px solid var(--grid);
    border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--mute); }

  button.on { border-color: var(--heat); color: var(--heat); }

  #bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  #stamp { color: var(--mute); font-size: 11px; }
  #status { color: var(--mute); }
  #status:empty { display: none; }
  #probe-wrap { margin: 6px 0 2px; }
  .probe-cap { color: var(--mute); font-size: 11px; margin-bottom: 2px; }
  #recent { margin-top: 20px; }
  .recent-cap { color: var(--mute); font-size: 11px; margin-bottom: 6px; }
  .recent-scroll { overflow-x: auto; border: 1px solid var(--grid); border-radius: 7px; }
  #recent-tbl { border-collapse: collapse; font-size: 11px; white-space: nowrap; }
  #recent-tbl th { background: var(--grid); padding: 5px 8px; text-align: right;
                   font-weight: 600; position: sticky; top: 0; }
  #recent-tbl td { padding: 4px 8px; text-align: right;
                   border-top: 1px solid var(--grid); }
  #recent-tbl th:first-child, #recent-tbl td:first-child,
  #recent-tbl th:last-child, #recent-tbl td:last-child { text-align: left; }
  #recent-tbl td.na { color: var(--grid); }
  #recent-tbl td.flag { color: var(--heat); }
  #status.err { color: var(--heat); }


  #controls { display: none; gap: 8px; align-items: center; margin-bottom: 8px; }
  #plot { width: 100%; }
</style>

import base64
import gzip
import io
import json
import warnings

import numpy as np
import pandas as pd

SENSORS = list("ABCDEFGH")
RINGS = [1, 2, 3]
TEMP_COLS = [f"Ring{r}_Sensor{s}" for r in RINGS for s in SENSORS]

# Commanded heater schedule. The logger does not record pulse boundaries
# reliably, so the nominal on-time is used to reconstruct the true window around
# whatever heater-on samples survived.
HEATER_ON_S = 240.0
HEATER_OFF_S = 1200.0
HEATER_PERIOD_S = HEATER_ON_S + HEATER_OFF_S
CYCLE_GAP_S = 600.0

# A reading this far from its own record's median across all 24 thermistors is a
# spike. The sensors sit in the same water, so the legitimate spread is small.
# Relative rather than an absolute floor like "below 5 degC", which would misfire
# on a genuinely cold deployment.
MAX_DEVIATION_C = 2.0
MAX_SPIKE_FRACTION = 0.5

DROPOUT_GAP_S = 120.0
MIN_DROPOUT_RECORDS = 5
MERGE_S = 720.0

SENSOR_COLOR = {
    "A": "#4cc9f0", "B": "#4895ef", "C": "#7b6cf6", "D": "#b892ff",
    "E": "#f072c0", "F": "#ffa5a5", "G": "#ffd166", "H": "#8ce99a",
}
GRID = "#26364a"
INK = "#dbe6f0"
MUTE = "#7b8fa6"
HEAT = "#ff5c39"

STATE = {}


def _column_map():
    out = {}
    n = 1
    for r in RINGS:
        for s in SENSORS:
            out[f"value_{n}"] = f"Ring{r}_Sensor{s}"
            n += 1
    out[f"value_{n}"] = "Heater"
    return out


def _epoch_ms(series):
    """Timezone-safe conversion to epoch milliseconds.

    tz_localize(None) comes first because on pandas 2.x a tz-aware Series returns
    an object array of Timestamps from .to_numpy(), and the astype would fail.
    """
    return series.dt.tz_localize(None).to_numpy().astype("datetime64[ms]").astype("int64")


def _trailing_zeros(arr):
    """Number of consecutive zeros at the end of each row."""
    nz = arr != 0
    any_nz = nz.any(axis=1)
    last = np.where(any_nz, arr.shape[1] - 1 - np.argmax(nz[:, ::-1], axis=1), -1)
    return arr.shape[1] - 1 - last


def load_bundled(b64):
    """Decompress the CSV bundled into this page and load it.

    Decompressing in Python rather than JS avoids depending on the browser's
    DecompressionStream API, which is not available everywhere.
    """
    return load_csv(gzip.decompress(base64.b64decode(b64)).decode("utf-8"))


def load_csv(text):
    """Parse an RRIV export and flag its three record-level failure modes.

    repeated    the API emits each reading roughly three times under slightly
                different timestamps. Keeping only the first of each identical
                run takes the apparent 10 s interval to its real ~38 s.
    misaligned  the record was left-padded with zeros, so readings are shifted
                right and the Heater column holds a temperature.
    truncated   the record was right-padded with zeros, so trailing columns --
                Heater included -- are padding. A padded Heater reads 0, which
                looks exactly like a genuine heater-off sample unless the
                trailing zeros are checked.
    """
    df = pd.read_csv(io.StringIO(text))
    missing = [c for c in _column_map() if c not in df.columns]
    if "timestamp" not in df.columns or missing:
        raise ValueError("Not an RRIV export: expected timestamp plus value_1..value_25.")

    df = df.rename(columns=_column_map())
    df["timestamp"] = pd.to_datetime(df["timestamp"], utc=True)
    df = df.sort_values("timestamp").drop_duplicates("timestamp").reset_index(drop=True)

    vals = df[TEMP_COLS + ["Heater"]].to_numpy(dtype="float64")
    if len(df) > 1:
        # NaN-aware: an empty record repeated three times is still a repeat, but
        # NaN != NaN would treat each copy as distinct.
        both_nan = np.isnan(vals[1:]) & np.isnan(vals[:-1])
        repeat = np.r_[False, ((vals[1:] == vals[:-1]) | both_nan).all(axis=1)]
    else:
        repeat = np.zeros(len(df), dtype=bool)
    n_repeat = int(repeat.sum())
    df = df.loc[~repeat].reset_index(drop=True)

    temps_arr = df[TEMP_COLS].to_numpy(dtype="float64")
    # A record carrying no values at all. Distinct from a shifted record, and the
    # most strongly heater-locked failure of the three.
    df["empty"] = np.isnan(temps_arr).all(axis=1) & df["Heater"].isna()
    df["misaligned"] = ~df["Heater"].isin([0, 1]) & ~df["empty"]
    df["truncated"] = (_trailing_zeros(temps_arr) > 0) & ~df["misaligned"] & ~df["empty"]
    df["n_dropout"] = (df[TEMP_COLS] == 0).sum(axis=1)

    # 0.0 is a failed read or padding, never a real 0 degC measurement.
    df[TEMP_COLS] = df[TEMP_COLS].replace(0.0, np.nan)
    df.loc[df["misaligned"], TEMP_COLS] = np.nan
    df.loc[df["misaligned"] | df["truncated"] | df["empty"], "Heater"] = np.nan

    # Spike removal. Corrupt records sometimes carry readings a few degrees above
    # zero while the rest of the record sits at ambient.
    arr = df[TEMP_COLS].to_numpy(dtype="float64")
    with warnings.catch_warnings():
        warnings.simplefilter("ignore", RuntimeWarning)
        median = np.nanmedian(arr, axis=1, keepdims=True)
    spike = (np.abs(arr - median) > MAX_DEVIATION_C) & np.isfinite(arr)
    finite = np.isfinite(arr).sum(axis=1)
    unusable = spike.sum(axis=1) > MAX_SPIKE_FRACTION * np.maximum(finite, 1)
    spike[unusable] = np.isfinite(arr[unusable])
    df["n_spike"] = spike.sum(axis=1)
    arr[spike] = np.nan
    df[TEMP_COLS] = arr

    STATE["df"] = df
    STATE["cycles"] = find_cycles(df)
    STATE["flow"] = flow_2d(df, STATE["cycles"])
    STATE["vert"] = flow_vertical(df, STATE["cycles"])
    return json.dumps(summary(df, STATE["cycles"], n_repeat))


def _clusters(x, tol, min_n=1):
    """Group a sorted 1-D array into runs separated by more than tol."""
    if x.size == 0:
        return []
    g = np.r_[0, np.cumsum(np.diff(x) > tol)]
    out = []
    for i in range(g.max() + 1):
        m = x[g == i]
        if len(m) >= min_n:
            out.append((m[0], m[-1], len(m)))
    return out


def find_cycles(df):
    """Reconstruct the heater pulse train from two kinds of evidence.

    The heater flag alone is not enough: a truncated record reports 0 when the
    true state is unknown, and a shifted record loses the flag entirely, so over
    much of a deployment only a sample or two per pulse survives.

    The second source is the corruption itself. Firing the heater disturbs
    communications, so records arriving during a pulse are disproportionately
    shifted or truncated. Those corrupted records cluster into ~4-minute runs
    recurring at the heater period, which makes a comms dropout a positive marker
    of heating rather than merely missing data.
    """
    h = df["Heater"].to_numpy(dtype="float64")
    corrupt = (df["misaligned"] | df["truncated"] | df["empty"]).to_numpy()
    origin = df["timestamp"].iloc[0]
    sec = (df["timestamp"] - origin).dt.total_seconds().to_numpy()

    on_s = np.sort(sec[h == 1])
    off_s = np.sort(sec[h == 0])
    bad_s = np.sort(sec[corrupt])
    if on_s.size == 0 and bad_s.size == 0:
        return []

    def place(first, last):
        st = (first + last) / 2 - HEATER_ON_S / 2
        before = off_s[off_s < first]
        after = off_s[off_s > last]
        lo = before[-1] if before.size else st
        hi = after[0] if after.size else st + HEATER_ON_S
        if st < lo:
            st = lo
        if st + HEATER_ON_S > hi:
            st = max(lo, hi - HEATER_ON_S)
        st = min(st, first)
        st = max(st, last - HEATER_ON_S)
        return st

    cand = []
    for f, l, n in _clusters(on_s, CYCLE_GAP_S):
        cand.append({"s": place(f, l), "ev": "flag", "n": n, "span": l - f})
    for f, l, n in _clusters(bad_s, DROPOUT_GAP_S, MIN_DROPOUT_RECORDS):
        cand.append({"s": place(f, l), "ev": "dropout", "n": 0, "span": 0.0})

    cand.sort(key=lambda e: e["s"])
    merged = []
    for e in cand:
        if merged and e["s"] - merged[-1]["s"] < MERGE_S:
            if merged[-1]["ev"] == "dropout" and e["ev"] == "flag":
                merged[-1] = e
            continue
        merged.append(e)

    for a, b in zip(list(merged[:-1]), list(merged[1:])):
        span = b["s"] - a["s"]
        n = int(round(span / HEATER_PERIOD_S))
        for j in range(1, n):
            merged.append({"s": a["s"] + span * j / n, "ev": "schedule",
                           "n": 0, "span": 0.0})
    merged.sort(key=lambda e: e["s"])

    base = _epoch_ms(pd.Series([origin]))[0]
    out = []
    for c in merged:
        out.append({
            "x0": int(base + c["s"] * 1000),
            "x1": int(base + (c["s"] + HEATER_ON_S) * 1000),
            "ev": c["ev"],
            "full": bool(c["ev"] == "flag" and c["span"] >= 0.6 * HEATER_ON_S),
            "on_start": origin + pd.Timedelta(seconds=float(c["s"])),
            "cycle": 0,
        })
    for i, c in enumerate(out, start=1):
        c["cycle"] = i
    return out


def summary(df, cycles, n_repeat):
    dt = df["timestamp"].diff().dt.total_seconds().dropna()
    bad = df["misaligned"] | (df["n_dropout"] > 0)
    return {
        "n_rows": int(len(df)),
        "n_repeat": n_repeat,
        "start": df["timestamp"].min().strftime("%Y-%m-%d %H:%M"),
        "end": df["timestamp"].max().strftime("%Y-%m-%d %H:%M"),
        "pct_valid": round(100.0 * (len(df) - int(bad.sum())) / max(len(df), 1), 1),
        "n_misaligned": int(df["misaligned"].sum()),
        "n_empty": int(df["empty"].sum()),
        "n_truncated": int(df["truncated"].sum()),
        "n_dropout": int((df["n_dropout"] > 0).sum()),
        "n_spike": int((df["n_spike"] > 0).sum()),
        "median_dt_s": round(float(dt.median()), 1) if len(dt) else 0.0,
        "n_cycles": len(cycles),
        "n_full": sum(1 for c in cycles if c["full"]),
        "n_flag": sum(1 for c in cycles if c["ev"] == "flag"),
        "n_dropout_ev": sum(1 for c in cycles if c["ev"] == "dropout"),
        "n_schedule": sum(1 for c in cycles if c["ev"] == "schedule"),
        "flow_lag_s": STATE["flow"].get("lag_s"),

        "flow_dir": STATE["flow"].get("direction_deg"),
        "flow_coh": STATE["flow"].get("coherence"),

# =============================================================================
# Eight-sensor 2D flow vector (ring plane)
#
# Port of flow_8sensor_ring2.R. Four opposing pairs A/E, B/F, C/G, D/H on axes
# 0/45/90/135 deg. Adapted from the six-sensor version, which used three pairs
# A/D, B/E, C/F on axes 30/90/150.
# =============================================================================

FLOW_RING = 2
# Which sensor faces north. Everything downstream derives from this, so
# re-orienting the probe is a one-line change. If it faces MAGNETIC north, add
# the local declination to get true north (about -5.5 deg in west-central
# Indiana, i.e. true = magnetic - 5.5).
NORTH_SENSOR = "G"

# Azimuth of each sensor, degrees clockwise from north.
SENSOR_AZIMUTH_DEG = {
    s: ((i - SENSORS.index(NORTH_SENSOR)) * 45.0) % 360.0
    for i, s in enumerate(SENSORS)
}

# The four opposing pairs, each labelled with the true azimuth of its first
# sensor, derived so the north reference propagates rather than being restated.
PAIRS = [(a, SENSORS[(SENSORS.index(a) + 4) % 8], SENSOR_AZIMUTH_DEG[a])
         for a in SENSORS[:4]]


# Projecting N opposing-pair log-ratios spread evenly across 180 deg returns
# M * N/2, where M is the true anisotropy amplitude. The six-sensor script left
# that factor in, so its magnitudes carry an implicit 1.5x and eight sensors
# would carry 2.0x. Dividing it out puts both probes on one scale.
NORMALISE_PROJECTION = True

BASELINE_S = 190.0
MIN_PULSE_C = 0.30
LAG_MIN_S, LAG_MAX_S, LAG_STEP_S = 30.0, 900.0, 30.0

# --- Speed calibration, transferred from the six-sensor lab chamber ---------
# Digitised from "Speed calibration: log-ratio magnitude vs flow", 94 points
# across four pump rates; quadratic refit R^2 = 0.958.
#   flux_cm_min = a + b*H6 + c*H6**2
# H6 is on the SIX-sensor script's unnormalised scale, so our normalised
# magnitude is multiplied by 3/2 first -- the projection gain that script left in.
CALIB_COEF = (-4.0911, 25.4244, -6.7564)
CALIB_SCALE_TO_6SENSOR = 1.5

# Range the calibration points actually span. Outside it the quadratic is
# extrapolation: it peaks at H6 = 1.88 and crosses zero at H6 = 0.168.
CALIB_H_RANGE = (0.597, 1.831)

# Fitted at t+390 s, so flow is evaluated there even though direction uses the
# coherence-optimal lag. t+330 s reads about 8% high through this curve.
CALIB_LAG_S = 390.0

# The lab flow axis is LABELLED ml/min but is already a Darcy flux in feet per
# day: the script applies flow = 0.1148*Q + 0.0077 to the pump rate Q in ml/min,
# and 0.1148 = 47.244 / 411.5, where 47.244 = 1440 min/day / 30.48 cm/ft and
# 411.5 cm^2 is the chamber cross-section. 82 ml/min through 411.5 cm^2 is
# 9.414 ft/day and the plotted level is 9.4213. So no further unit conversion is
# applied here -- adding one multiplies the answer by 47.
CHAMBER_AREA_CM2 = 411.5


def flow_rate_ft_day(h_norm):
    """Normalised magnitude to Darcy flux in feet per day.

    The calibration already returns ft/day, so no unit factor is applied.
    """
    h6 = np.asarray(h_norm, dtype="float64") * CALIB_SCALE_TO_6SENSOR
    a, b, c = CALIB_COEF
    flux = a + b * h6 + c * h6 ** 2
    flux = np.where(flux > 0, flux, np.nan)
    in_range = (h6 >= CALIB_H_RANGE[0]) & (h6 <= CALIB_H_RANGE[1])
    return flux, in_range

DIR_COLOR = "#4ade80"
MAG_COLOR = "#ffb703"


def _sensor_tensor(df, cycles, lags, ring=FLOW_RING):
    """Baseline-corrected value of each of the eight sensors at every lag.

    Shape (n_cycles, n_lags, 8). Every lag is interpolated in one pass per
    sensor; sweeping lag by re-extracting the window each time is far too slow
    to run in a browser.

    Baseline is the mean over BASELINE_S *before* the pulse, not the first
    heater-on samples the six-sensor script used: readings taken while the
    heater is energised are depressed by roughly 0.1 degC, so an in-pulse
    baseline biases low.
    """
    lags = np.asarray(lags, dtype="float64")
    cols = [f"Ring{ring}_Sensor{s}" for s in SENSORS]
    origin = df["timestamp"].iloc[0]
    sec = (df["timestamp"] - origin).dt.total_seconds().to_numpy()
    starts = (cycles["on_start"] - origin).dt.total_seconds().to_numpy()
    data = df[cols].to_numpy(dtype="float64")

    out = np.full((len(cycles), len(lags), len(SENSORS)), np.nan)
    span = float(lags.max())
    for i, st in enumerate(starts):
        w = np.flatnonzero((sec >= st - BASELINE_S - 20) & (sec <= st + span + 60))
        if w.size < 8:
            continue
        sw = sec[w] - st
        pre = (sw < 0) & (sw >= -BASELINE_S)
        if pre.sum() < 2:
            continue
        block = data[w]
        for k in range(len(SENSORS)):
            y = block[:, k]
            m = np.isfinite(y)
            if m.sum() < 5:
                continue
            sel = pre & m
            if not sel.any():
                continue
            with warnings.catch_warnings():
                warnings.simplefilter("ignore", RuntimeWarning)
                b = np.nanmean(y[sel])
            if not np.isfinite(b):
                continue
            reach = sw[m].max()
            vals = np.interp(lags, sw[m], y[m] - b)
            vals[lags > reach] = np.nan
            out[i, :, k] = vals
    return out


def _project(M, log_ratio=True):
    """Project the four opposing-pair signals onto the ring plane."""
    idx = {s: i for i, s in enumerate(SENSORS)}
    x = np.zeros(len(M))
    z = np.zeros(len(M))
    for a, b, ang in PAIRS:
        va, vb = M[:, idx[a]], M[:, idx[b]]
        with np.errstate(invalid="ignore", divide="ignore"):
            sig = np.log(va / vb) if log_ratio else va - vb
        x = x + sig * np.sin(np.deg2rad(ang))
        z = z + sig * np.cos(np.deg2rad(ang))
    gain = 2.0 / len(PAIRS) if NORMALISE_PROJECTION else 1.0
    x, z = x * gain, z * gain
    return x, z, np.hypot(x, z), np.degrees(np.arctan2(x, z)) % 360


def _circular_r(deg):
    a = np.deg2rad(np.asarray(deg, dtype="float64"))
    if a.size == 0:
        return float("nan")
    return float(np.hypot(np.mean(np.cos(a)), np.mean(np.sin(a))))


def _circular_mean(deg):
    a = np.deg2rad(np.asarray(deg, dtype="float64"))
    if a.size == 0:
        return float("nan")
    return float(np.degrees(np.arctan2(np.mean(np.sin(a)), np.mean(np.cos(a)))) % 360)


def _cycle_frame(cycles):
    """The shape-oriented cycle list, as a frame the vector code can index."""
    return pd.DataFrame({
        "cycle": [c["cycle"] for c in cycles],
        "on_start": pd.to_datetime([c["on_start"] for c in cycles], utc=True),
    })


def flow_2d(df, cycles, ring=FLOW_RING, lag=None):
    """Per-cycle 2D flow vector from one ring's eight sensors.

    With no known flow rate there is no R-squared to sweep on, which is what the
    lab script used to pick its measurement lag. The flow direction is instead
    physically constant over a deployment, so the lag where independent cycles
    most agree is the lag where advection dominates noise.
    """
    if not cycles:
        return {"n_usable": 0, "points": []}
    cycles = _cycle_frame(cycles)

    lags = np.arange(LAG_MIN_S, LAG_MAX_S + 1, LAG_STEP_S)
    tensor = _sensor_tensor(df, cycles, lags, ring)

    # Pulse amplitude separates a live cycle from one where the heater was
    # commanded but deposited no heat.
    with warnings.catch_warnings():
        warnings.simplefilter("ignore", RuntimeWarning)
        amp = np.nanmean(tensor[:, int(np.argmin(np.abs(lags - 420.0))), :], axis=1)
    live = np.isfinite(amp) & (amp > MIN_PULSE_C)

    sweep = []
    if lag is None:
        pool = tensor[live] if live.sum() >= 10 else tensor
        for j, lg in enumerate(lags):
            M = pool[:, j, :]
            ok = np.isfinite(M).all(axis=1)
            if ok.sum() < 10:
                continue
            pos = ok & (M > 0).all(axis=1)
            if pos.sum() >= 10:
                _, _, _, deg = _project(M[pos])
                sweep.append((float(lg), int(pos.sum()), _circular_r(deg)))
        if sweep:
            best_n = max(s[1] for s in sweep)
            ok_sweep = [s for s in sweep if s[1] >= 0.5 * best_n]
            lag = max(ok_sweep, key=lambda s: s[2])[0]
        else:
            lag = 330.0

    M = tensor[:, int(np.argmin(np.abs(lags - lag))), :]
    finite = np.isfinite(M).all(axis=1)
    usable = finite & live & (M > 0).all(axis=1)
    x, z, mag, deg = _project(M)

    # Flow rate is evaluated at the calibration's own lag, not the
    # coherence-optimal one; the curve is only valid where it was fitted.
    Mc = tensor[:, int(np.argmin(np.abs(lags - CALIB_LAG_S))), :]
    okc = np.isfinite(Mc).all(axis=1) & live & (Mc > 0).all(axis=1)
    _, _, magc, _ = _project(Mc)
    magc = np.where(okc, magc, np.nan)
    ft_day, in_range = flow_rate_ft_day(magc)

    ms = _epoch_ms(cycles["on_start"])
    pts = []
    for i in range(len(cycles)):
        if not usable[i]:
            continue
        pts.append({"t": int(ms[i]), "dir": float(deg[i]), "mag": float(mag[i]),
                    "amp": float(amp[i]), "cycle": int(cycles["cycle"].iloc[i])})
    flowpts = []
    for i in range(len(cycles)):
        if not np.isfinite(ft_day[i]):
            continue
        flowpts.append({"t": int(ms[i]), "ft": float(ft_day[i]),
                        "mag": float(magc[i]), "ok": bool(in_range[i]),
                        "cycle": int(cycles["cycle"].iloc[i])})

    dirs = np.array([p["dir"] for p in pts])
    mags = np.array([p["mag"] for p in pts])
    fts = np.array([p["ft"] for p in flowpts])
    return {
        "points": pts,
        "flowpoints": flowpts,
        "calib_lag_s": CALIB_LAG_S,
        "n_calibrated": len(flowpts),
        "n_calib_in_range": int(sum(1 for p in flowpts if p["ok"])),
        "flow_ft_day": float(np.median(fts)) if len(fts) else float("nan"),
        "lag_s": float(lag),
        "ring": int(ring),
        "n_usable": len(pts),
        "n_live": int(live.sum()),
        "direction_deg": _circular_mean(dirs),
        "coherence": _circular_r(dirs),
        "mag_mean": float(mags.mean()) if len(mags) else float("nan"),
        "mag_sd": float(mags.std()) if len(mags) else float("nan"),
    }


# =============================================================================
# Vertical response (ring 1 vs ring 3)
# =============================================================================

VERT_TOP_RING, VERT_BOTTOM_RING = 1, 3

# The vertical velocity is scaled from the horizontal, not pushed through the
# speed calibration directly.
#
# The calibration maps a *log-ratio* to a velocity, and a log-ratio is relative.
# It was fitted on pairs at equal distance from the heater that both warm
# strongly -- ring 2's sensors, rising about 0.55 degC. Rings 1 and 3 sit much
# further out, rising 0.15 and 0.00 degC, so the same absolute asymmetry becomes
# an enormous relative one and log(top/bottom) saturates against the quadratic's
# ceiling of 19.8 ft/day whatever the flow. Both axes are therefore compared as
# absolute differences between opposing sensors, and the vertical is scaled by
# the horizontal velocity:
#
#     v_vertical = v_horizontal * (dT_vertical / dT_horizontal)
#
# An empirical factor applied to the vertical result before reporting. Set to
# 0.5 by judgement, not measurement: the scaled numbers still read high against
# expectation, and both known unknowns push that way -- the ring spacing is
# probably larger than the horizontal sensor separation, and a buoyant plume
# rises on its own. A back-of-the-envelope placeholder; set to 1.0 once a
# vertical calibration exists.
VERT_SCALE = 0.5

# Linear in velocity, which holds while plume displacement is small relative to
# sensor spacing, and it preserves what the raw temperatures show: a smaller
# vertical temperature difference gives a smaller vertical velocity.
TOP_COLOR = "#4cc9f0"
BOT_COLOR = "#f072c0"
VERT_COLOR = "#8ce99a"


def flow_vertical(df, cycles, top=VERT_TOP_RING, bottom=VERT_BOTTOM_RING):
    """Vertical asymmetry from the top and bottom rings.

    The horizontal solver pairs sensors across a ring and takes log(near/far).
    Rings 1 and 3 are that same pair rotated into the vertical, so the direct
    analogue is log(top_s / bottom_s) averaged over the eight letters.

    Two caveats absent from the horizontal case: the vertical separation is the
    ring spacing rather than the ring diameter, so the horizontal speed
    calibration does not carry over and no ft/day is reported; and a heated
    plume rises on its own, so an upward asymmetry is not evidence of upward
    flow until free convection is ruled out.

    The log-ratio needs both rings above baseline. Where the lower ring shows no
    rise it is undefined, so the difference form is carried alongside.
    """
    if not cycles:
        return {"points": []}
    cyc = _cycle_frame(cycles)
    cyc_df = df
    lags = np.array([CALIB_LAG_S])
    A = _sensor_tensor(df, cyc, lags, ring=top)[:, 0, :]
    B = _sensor_tensor(df, cyc, lags, ring=bottom)[:, 0, :]
    R = _sensor_tensor(df, cyc, lags, ring=FLOW_RING)[:, 0, :]

    with warnings.catch_warnings():
        warnings.simplefilter("ignore", RuntimeWarning)
        top_C = np.nanmean(A, axis=1)
        bot_C = np.nanmean(B, axis=1)
        ref = np.nanmean(R, axis=1)
        ratio = np.where((A > 0) & (B > 0), A / B, np.nan)
        v_log = np.nanmean(np.log(ratio), axis=1)

    # Absolute difference between opposing sensors on both axes, so the two are
    # measured the same way, then scale by the horizontal velocity.
    Cm = _sensor_tensor(cyc_df, cyc, [CALIB_LAG_S], ring=FLOW_RING)[:, 0, :]
    _, _, h_diff, _ = _project(Cm, log_ratio=False)
    v_diff = top_C - bot_C
    with np.errstate(invalid="ignore", divide="ignore"):
        ratio = np.where(h_diff > 0, v_diff / h_diff, np.nan)
    horiz = np.full(len(cyc), np.nan)
    fl = STATE.get("flow", {})
    by_cycle = {p["cycle"]: p["ft"] for p in fl.get("flowpoints", [])}
    for i, cnum in enumerate(cyc["cycle"].to_numpy()):
        if int(cnum) in by_cycle:
            horiz[i] = by_cycle[int(cnum)]
    v_ft = horiz * ratio * VERT_SCALE

    lr_ok = (np.isfinite(A).all(axis=1) & np.isfinite(B).all(axis=1)
             & (A > 0).all(axis=1) & (B > 0).all(axis=1))
    # A live pulse is judged on the reference ring, as in the horizontal solver;
    # the top ring only ever sees a fraction as much heat.
    live = np.isfinite(ref) & (ref > MIN_PULSE_C) & np.isfinite(top_C)

    ms = _epoch_ms(cyc["on_start"])
    pts = []
    for i in range(len(cyc)):
        if not live[i]:
            continue
        if not np.isfinite(v_ft[i]):
            continue
        pts.append({"t": int(ms[i]), "top": float(top_C[i]),
                    "bot": float(bot_C[i]), "ft": float(v_ft[i]),
                    "ratio": float(ratio[i]),
                    "cycle": int(cyc["cycle"].iloc[i])})
    fts = np.array([p["ft"] for p in pts])
    return {
        "points": pts,
        "lag_s": CALIB_LAG_S,
        "top_ring": int(top), "bottom_ring": int(bottom),
        "n_live": len(pts),
        "n_logratio": int((lr_ok & live).sum()),
        "top_median": float(np.median([p["top"] for p in pts])) if pts else float("nan"),
        "bot_median": float(np.median([p["bot"] for p in pts])) if pts else float("nan"),
        "ft_median": float(np.median(fts)) if len(fts) else float("nan"),
        "ratio_median": float(np.median([p["ratio"] for p in pts])) if pts else float("nan"),
    }


PROBE_RADIUS = 1.0
PROBE_RING_Z = {1: 0.62, 2: 0.0, 3: -0.62}
PROBE_RING_NAME = {1: "Ring 1 (top)", 2: "Ring 2", 3: "Ring 3 (bottom)"}


def probe_spec():
    """A 3D key to the probe geometry, so the panels above are readable.

    Sensor letters carry the same colours as the ring traces, azimuth runs
    clockwise from A viewed from above, and the arrow is the resolved flow
    direction. Ring spacing here is schematic -- it shows the order of the
    rings, not their true separation.
    """
    ang = np.deg2rad([SENSOR_AZIMUTH_DEG[s] for s in SENSORS])
    # Azimuth measured clockwise from A, so A sits on +y and the horizontal
    # components are (sin, cos) rather than the usual (cos, sin).
    ux, uy = np.sin(ang), np.cos(ang)
    traces = []

    for r in RINGS:
        z = PROBE_RING_Z[r]
        circ = np.linspace(0, 2 * np.pi, 121)
        traces.append({
            "type": "scatter3d", "mode": "lines",
            "x": (PROBE_RADIUS * np.sin(circ)).tolist(),
            "y": (PROBE_RADIUS * np.cos(circ)).tolist(),
            "z": [z] * len(circ),
            "line": {"color": GRID, "width": 4},
            "hoverinfo": "skip", "showlegend": False,
        })
        traces.append({
            "type": "scatter3d", "mode": "markers",
            "x": (PROBE_RADIUS * ux).tolist(),
            "y": (PROBE_RADIUS * uy).tolist(),
            "z": [z] * len(SENSORS),
            "marker": {"size": 5, "color": [SENSOR_COLOR[s] for s in SENSORS]},
            "text": [f"Ring {r} sensor {s}" for s in SENSORS],
            "hovertemplate": "%{text}<extra></extra>", "showlegend": False,
        })
        # Letters only on the ring the flow solution comes from; on all three
        # they collide and the view stops being a key to anything.
        if r == FLOW_RING:
            traces.append({
                "type": "scatter3d", "mode": "text",
                "x": (1.28 * PROBE_RADIUS * ux).tolist(),
                "y": (1.28 * PROBE_RADIUS * uy).tolist(),
                "z": [z] * len(SENSORS),
                "text": SENSORS,
                "textfont": {"size": 12, "color": [SENSOR_COLOR[s] for s in SENSORS]},
                "hoverinfo": "skip", "showlegend": False,
            })
        traces.append({
            "type": "scatter3d", "mode": "text",
            "x": [-1.75], "y": [0.0], "z": [z],
            "text": [PROBE_RING_NAME[r]],
            "textfont": {"size": 11, "color": INK},
            "hoverinfo": "skip", "showlegend": False,
        })

    # Heater down the axis.
    traces.append({
        "type": "scatter3d", "mode": "lines",
        "x": [0, 0], "y": [0, 0], "z": [-0.86, 0.86],
        "line": {"color": HEAT, "width": 8},
        "text": ["heater"] * 2, "hovertemplate": "heater<extra></extra>",
        "showlegend": False,
    })

    # Up indicator, offset clear of the rings.
    traces.append({
        "type": "scatter3d", "mode": "lines",
        "x": [1.85, 1.85], "y": [0, 0], "z": [-0.55, 0.55],
        "line": {"color": MUTE, "width": 3},
        "hoverinfo": "skip", "showlegend": False,
    })
    traces.append({
        "type": "cone", "x": [1.85], "y": [0], "z": [0.72],
        "u": [0], "v": [0], "w": [1],
        "sizemode": "absolute", "sizeref": 0.28, "anchor": "tip",
        "colorscale": [[0, MUTE], [1, MUTE]], "showscale": False,
        "hoverinfo": "skip",
    })
    traces.append({
        "type": "scatter3d", "mode": "text",
        "x": [1.85], "y": [0], "z": [0.98], "text": ["up"],
        "textfont": {"size": 12, "color": MUTE},
        "hoverinfo": "skip", "showlegend": False,
    })


    # Compass rose on a plane below the probe, so the azimuth convention is
    # visible without colliding with the ring labels on the probe itself.
    rose_z = -1.05
    circ = np.linspace(0, 2 * np.pi, 121)
    traces.append({
        "type": "scatter3d", "mode": "lines",
        "x": (1.45 * np.sin(circ)).tolist(),
        "y": (1.45 * np.cos(circ)).tolist(),
        "z": [rose_z] * len(circ),
        "line": {"color": GRID, "width": 2},
        "hoverinfo": "skip", "showlegend": False,
    })
    for label, az in (("N", 0.0), ("E", 90.0), ("S", 180.0), ("W", 270.0)):
        a = np.deg2rad(az)
        traces.append({
            "type": "scatter3d", "mode": "text",
            "x": [1.72 * np.sin(a)], "y": [1.72 * np.cos(a)], "z": [rose_z],
            "text": [label],
            "textfont": {"size": 13 if label == "N" else 11,
                         "color": INK if label == "N" else MUTE},
            "hoverinfo": "skip", "showlegend": False,
        })
    traces.append({
        "type": "cone", "x": [0], "y": [1.45], "z": [rose_z],
        "u": [0], "v": [1], "w": [0],
        "sizemode": "absolute", "sizeref": 0.24, "anchor": "tip",
        "colorscale": [[0, INK], [1, INK]], "showscale": False,
        "hoverinfo": "skip",
    })

    # Resolved flow direction, if a solution exists.
    flow = STATE.get("flow", {})
    vert = STATE.get("vert", {})
    az = flow.get("direction_deg")
    if az is not None and np.isfinite(az):
        h = flow.get("flow_ft_day") or 0.0
        v = vert.get("ft_median") or 0.0
        a = np.deg2rad(az)
        vec = np.array([np.sin(a) * h, np.cos(a) * h, v], dtype="float64")
        n = np.linalg.norm(vec)
        if n > 0:
            vec = vec / n * 1.45
            traces.append({
                "type": "scatter3d", "mode": "lines",
                "x": [0, float(vec[0])], "y": [0, float(vec[1])], "z": [0, float(vec[2])],
                "line": {"color": DIR_COLOR, "width": 7},
                "hoverinfo": "skip", "showlegend": False,
            })
            traces.append({
                "type": "cone",
                "x": [float(vec[0])], "y": [float(vec[1])], "z": [float(vec[2])],
                "u": [float(vec[0])], "v": [float(vec[1])], "w": [float(vec[2])],
                "sizemode": "absolute", "sizeref": 0.32, "anchor": "tip",
                "colorscale": [[0, DIR_COLOR], [1, DIR_COLOR]], "showscale": False,
                "text": [f"flow {az:.0f}\u00b0, {h:.1f} ft/day horizontal"],
                "hovertemplate": "%{text}<extra></extra>",
            })

    axis = {"showgrid": False, "zeroline": False, "showticklabels": False,
            "showbackground": False, "title": {"text": ""}, "range": [-2.1, 2.1]}
    layout = {
        "height": 380,
        "paper_bgcolor": "rgba(0,0,0,0)",
        "margin": {"l": 0, "r": 0, "t": 0, "b": 0},
        "showlegend": False,
        "font": {"color": INK,
                 "family": "ui-monospace, SFMono-Regular, Menlo, monospace"},
        "scene": {
            "xaxis": dict(axis), "yaxis": dict(axis),
            "zaxis": dict(axis, range=[-1.5, 1.5]),
            "aspectmode": "manual",
            "aspectratio": {"x": 1, "y": 1, "z": 0.85},
            "camera": {"eye": {"x": 1.5, "y": 1.5, "z": 0.75}},
            "dragmode": "orbit",
        },
    }
    return json.dumps({"data": traces, "layout": layout})


def recent_table(n=5):
    """The most recent n readings, as rows for the table at the foot of the page.

    These are cleaned readings, not raw API rows: repeated records are already
    collapsed and dropped or spiked values are blank rather than 0.0 or a wild
    number. The flag column says why a value is missing.
    """
    df = STATE.get("df")
    if df is None or df.empty:
        return json.dumps({"cols": [], "rows": []})

    tail = df.tail(int(n)).iloc[::-1]          # newest first
    cols = ["time"] + [f"R{r}{s}" for r in RINGS for s in SENSORS] + ["heater", "flags"]

    rows = []
    for _, rec in tail.iterrows():
        cells = [rec["timestamp"].strftime("%m-%d %H:%M:%S")]
        for r in RINGS:
            for s in SENSORS:
                v = rec[f"Ring{r}_Sensor{s}"]
                cells.append("\u2014" if not np.isfinite(v) else f"{v:.2f}")
        hv = rec["Heater"]
        cells.append("\u2014" if not np.isfinite(hv) else ("on" if hv == 1 else "off"))
        flags = []
        if rec["misaligned"]:
            flags.append("shifted")
        if rec["truncated"]:
            flags.append("truncated")
        if rec.get("n_spike", 0):
            flags.append(f"{int(rec['n_spike'])} spike")
        if rec["n_dropout"]:
            flags.append(f"{int(rec['n_dropout'])} dropout")
        cells.append(", ".join(flags) if flags else "clean")
        rows.append(cells)

    return json.dumps({"cols": cols, "rows": rows,
                       "n_total": int(len(df)),
                       "latest": tail["timestamp"].iloc[0].strftime("%Y-%m-%d %H:%M:%S")})


def prepare(mode="raw"):
    """Fill float64 buffers and return only small metadata.

    Serialising 24 x N floats to JSON costs seconds and tens of megabytes. The
    arrays instead stay in WASM memory and JS reads them as Float64Array views,
    which makes the handover a memcpy. NaN survives the trip and plotly renders
    it as a gap, so no null substitution is needed.
    """
    df = STATE["df"]
    n = len(df)
    STATE["X"] = _epoch_ms(df["timestamp"]).astype("float64")

    Y = np.empty((24, n), dtype="float64")
    k = 0
    for r in RINGS:
        cols = [f"Ring{r}_Sensor{s}" for s in SENSORS]
        block = df[cols].to_numpy(dtype="float64")
        if mode == "spread":
            # A row where the whole ring dropped out is an all-NaN slice; the
            # mean is legitimately undefined there, so silence the warning.
            with warnings.catch_warnings():
                warnings.simplefilter("ignore", RuntimeWarning)
                block = block - np.nanmean(block, axis=1, keepdims=True)
        Y[k:k + 8] = block.T
        k += 8
    STATE["Y"] = Y
    return json.dumps({"n": n, "mode": mode})


def layout_spec(mode="raw"):
    """Axes, heater bands, legend, colours, and the two flow panels.

    Five stacked panels sharing one time axis: the three sensor rings, then the
    2D flow direction and the flow magnitude derived from ring FLOW_RING.
    """
    # Three ring panels of equal height, then two shorter flow panels.
    # Three ring panels, then direction, flux, and the vertical response.
    domains = [(0.845, 1.00), (0.675, 0.830), (0.505, 0.660),
               (0.340, 0.470), (0.175, 0.305), (0.010, 0.140)]
    flow0 = STATE.get("flow", {})
    vert0 = STATE.get("vert", {})
    titles = ["Ring 1", "Ring 2", "Ring 3",
              "2D flow direction (t+%.0fs)" % (flow0.get("lag_s") or 0),
              "Flow magnitude \u2014 Darcy flux (t+%.0fs)" % (flow0.get("calib_lag_s") or 0),
              "Vertical velocity \u2014 ring %d vs ring %d (t+%.0fs)" % (
                  vert0.get("top_ring", 1), vert0.get("bottom_ring", 3),
                  vert0.get("lag_s") or 0)]

    # Solid: heater flag survived across the whole pulse. Dotted orange: located
    # from a partial flag or from the comms dropout the pulse caused. Faint grey:
    # no evidence survived, placed by the schedule alone.
    shapes = []
    for i in range(1, 4):
        ref = "y domain" if i == 1 else f"y{i} domain"
        for c in STATE["cycles"]:
            colour = MUTE if c["ev"] == "schedule" else HEAT
            solid = c["full"]
            shapes.append({
                "type": "rect", "xref": "x", "yref": ref,
                "x0": c["x0"], "x1": c["x1"], "y0": 0, "y1": 1,
                "fillcolor": colour, "opacity": 0.26 if solid else 0.10,
                "line": {"width": 0 if solid else 1, "color": colour, "dash": "dot"},
                "layer": "below",
            })

    _v = STATE.get("vert", {})
    if _v.get("points"):
        shapes.append({
            "type": "line", "xref": "x domain", "yref": "y6",
            "x0": 0, "x1": 1, "y0": _v.get("ft_median", 0), "y1": _v.get("ft_median", 0),
            "line": {"color": MUTE, "width": 1, "dash": "dash"},
            "opacity": 0.5, "layer": "below",
        })

    flow = STATE.get("flow", {})
    pts = flow.get("points", [])
    if pts:
        # Reference lines at the circular-mean direction and the mean magnitude,
        # so scatter about the deployment average is readable at a glance.
        for ref, val, colour in [("y4", flow.get("direction_deg"), DIR_COLOR),
                                 ("y5", flow.get("flow_ft_day"), MAG_COLOR)]:
            if val is not None and np.isfinite(val):
                shapes.append({
                    "type": "line", "xref": "x domain", "yref": ref,
                    "x0": 0, "x1": 1, "y0": val, "y1": val,
                    "line": {"color": colour, "width": 1, "dash": "dash"},
                    "opacity": 0.55, "layer": "below",
                })

    ytitle = "dT from ring mean (\u00b0C)" if mode == "spread" else "\u00b0C"
    layout = {
        "height": 1400,
        "paper_bgcolor": "rgba(0,0,0,0)",
        "plot_bgcolor": "rgba(0,0,0,0)",
        "font": {"color": INK, "family": "ui-monospace, SFMono-Regular, Menlo, monospace",
                 "size": 12},
        "margin": {"l": 66, "r": 24, "t": 40, "b": 44},
        "hovermode": "closest",
        "showlegend": True,
        "legend": {"orientation": "h", "y": 1.05, "x": 1, "xanchor": "right",
                   "bgcolor": "rgba(0,0,0,0)"},
        "shapes": shapes,
        "annotations": [
            {"text": t, "x": 0, "xref": "paper", "xanchor": "left",
             "y": domains[i][1], "yref": "paper", "yanchor": "bottom",
             "showarrow": False, "font": {"size": 11, "color": MUTE}}
            for i, t in enumerate(titles)
        ],
        "xaxis": {"type": "date", "gridcolor": GRID, "zerolinecolor": GRID,
                  "anchor": "y6", "showspikes": True, "spikecolor": MUTE,
                  "spikethickness": 1, "spikemode": "across"},
    }
    for i in range(1, 4):
        key = "yaxis" if i == 1 else f"yaxis{i}"
        layout[key] = {"domain": list(domains[i - 1]), "anchor": "x",
                       "gridcolor": GRID, "zerolinecolor": GRID,
                       "title": {"text": ytitle}}

    layout["yaxis4"] = {
        "domain": list(domains[3]), "anchor": "x", "gridcolor": GRID,
        "zerolinecolor": GRID, "range": [0, 360],
        "tickmode": "array", "tickvals": [0, 90, 180, 270, 360],
        "title": {"text": "azimuth (\u00b0 from N)"},
    }
    layout["yaxis5"] = {
        "domain": list(domains[4]), "anchor": "x", "gridcolor": GRID,
        "zerolinecolor": GRID, "rangemode": "tozero",
        "title": {"text": "ft/day"},
    }
    layout["yaxis6"] = {
        "domain": list(domains[5]), "anchor": "x", "gridcolor": GRID,
        "zerolinecolor": GRID, "title": {"text": "ft/day (up +)"},
    }

    traces = []
    for i, r in enumerate(RINGS, start=1):
        for s in SENSORS:
            traces.append({
                "type": "scattergl", "mode": "lines", "name": s,
                "legendgroup": s, "showlegend": i == 1,
                "xaxis": "x", "yaxis": "y" if i == 1 else f"y{i}",
                "line": {"color": SENSOR_COLOR[s], "width": 1},
                "hovertemplate": "R" + str(r) + s + "  %{y:.3f} \u00b0C<extra></extra>",
            })

    # The two flow panels carry one point per usable pulse, so their data goes
    # inline rather than through the WASM buffer the ring traces use.
    ring = flow.get("ring", FLOW_RING)
    lag = flow.get("lag_s")
    t = [p["t"] for p in pts]
    traces.append({
        "type": "scattergl", "mode": "markers", "name": "direction",
        "showlegend": False, "xaxis": "x", "yaxis": "y4",
        "x": t, "y": [p["dir"] for p in pts],
        "marker": {"color": DIR_COLOR, "size": 5,
                   "line": {"width": 0}, "opacity": 0.85},
        "customdata": [[p["cycle"], p["mag"]] for p in pts],
        "hovertemplate": ("pulse %{customdata[0]}<br>%{y:.0f}\u00b0"
                          "<br>|H| %{customdata[1]:.3f}<extra></extra>"),
    })
    # Split so pulses outside the calibrated magnitude range read as hollow
    # markers: the quadratic still returns a number there, but it is
    # extrapolation and should not be mistaken for a measurement.
    fpts = flow.get("flowpoints", [])
    for subset, filled, nm in ((True, True, "in range"), (False, False, "extrapolated")):
        sel = [p for p in fpts if p["ok"] is subset]
        if not sel:
            continue
        traces.append({
            "type": "scattergl", "mode": "lines+markers" if subset else "markers",
            "name": nm, "showlegend": False, "xaxis": "x", "yaxis": "y5",
            "x": [p["t"] for p in sel], "y": [p["ft"] for p in sel],
            "line": {"color": MAG_COLOR, "width": 1},
            "marker": ({"color": MAG_COLOR, "size": 4} if filled else
                       {"color": "rgba(0,0,0,0)", "size": 5,
                        "line": {"color": MAG_COLOR, "width": 1}}),
            "customdata": [[p["cycle"], p["mag"]] for p in sel],
            "hovertemplate": ("pulse %{customdata[0]}<br>%{y:.0f} ft/day"
                              "<br>|H| %{customdata[1]:.3f}<extra></extra>"),
        })


    vpts = vert0.get("points", [])
    if vpts:
        traces.append({
            "type": "scattergl", "mode": "markers", "name": "vertical",
            "showlegend": False, "xaxis": "x", "yaxis": "y6",
            "x": [p["t"] for p in vpts], "y": [p["ft"] for p in vpts],
            "marker": {"color": VERT_COLOR, "size": 4},
            "customdata": [[p["cycle"], p["top"], p["bot"], p["ratio"]] for p in vpts],
            "hovertemplate": ("pulse %{customdata[0]}<br>%{y:+.1f} ft/day"
                              "<br>top %{customdata[1]:+.3f} \u00b0C"
                              "<br>bottom %{customdata[2]:+.3f} \u00b0C"
                              "<br>\u0394T ratio v/h %{customdata[3]:.2f}<extra></extra>"),
        })

    return json.dumps({"layout": layout, "traces": traces,
                       "n_ring_traces": 24,
                       "flow": {"ring": ring, "lag_s": lag,
                                "n": flow.get("n_usable", 0)}})
</script>

<script>
const $ = (id) => document.getElementById(id);
const status = $("status");
let py = null;
let mode = "raw";
let loaded = false;

function say(msg, isError) {
  status.textContent = msg;
  status.classList.toggle("err", !!isError);
}

async function boot() {
  try {
    say("Downloading Python runtime…");
    py = await loadPyodide();
    say("Loading numpy and pandas…");
    await py.loadPackage(["numpy", "pandas"]);
    py.runPython($("pysrc").textContent);

    // Three ways to get current data into a page the browser will not let talk
    // to api.rriv.org directly (it sends no access-control-allow-origin):
    //   1. a same-origin proxy, if serve_live.py is running
    //   2. the API itself, which works once that header is added upstream
    //   3. a public CORS proxy, which needs nothing running anywhere
    // Option 3 routes the request through a third party. That is fine for this
    // endpoint because the readings are public and unauthenticated; do not use
    // it for anything that carries a credential.
    const apiUrl = $("api-url").textContent.trim();
    const sources = [
      ["/api/readings", "local proxy"],
      [apiUrl, "API directly"],
      ["https://r.jina.ai/" + apiUrl, "public CORS proxy"],
    ];

    let s = null;
    let via = "";
    for (const [url, label] of sources) {
      if (!url) continue;
      try {
        say(`Fetching current data (${label})\u2026`);
        const resp = await fetch(url, { mode: "cors", cache: "no-store" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const raw = await resp.text();
        // A proxy may prepend its own preamble, so start at the header row
        // rather than assuming the body begins with it.
        const at = raw.indexOf("timestamp,value_1");
        if (at < 0) throw new Error("no CSV header in response");
        py.globals.set("csv_text", raw.slice(at));
        s = JSON.parse(py.runPython("load_csv(csv_text)"));
        via = label;
        break;
      } catch (err) {
        s = null;   // blocked, offline, or that route is down
      }
    }

    if (!s) {
      say("Reading bundled snapshot…");
      await new Promise((r) => setTimeout(r, 0));   // let the message paint
      py.globals.set("bundled_b64", $("bundled").textContent.trim());
      s = JSON.parse(py.runPython("load_bundled(bundled_b64)"));
    }
    cards(s);
    $("controls").style.display = "flex";
      loaded = true;
    draw();
    if (s && via) {
      say(`Live via ${via} \u2014 ${s.start} \u2192 ${s.end} UTC, ` +
          `fetched ${new Date().toLocaleTimeString()}`);
    } else {
      say(`Bundled snapshot: ${s.start} → ${s.end} UTC. Live fetch is blocked ` +
          `because the API sends no CORS header — run serve_live.py to proxy it, ` +
          `or refresh_dashboard.py to re-bake.`);
    }
  } catch (err) {
    say("Could not start Python: " + err.message, true);
  }
}

// Copy a numpy array out of WASM memory into a JS Float64Array. The buffer is a
// view into Python's heap, so it must be released and the proxy destroyed —
// otherwise every redraw leaks a few megabytes.
function grab(name) {
  const state = py.globals.get("STATE");
  const arr = state.get(name);
  const buf = arr.getBuffer("f64");
  const copy = buf.data.slice();
  buf.release();
  arr.destroy();
  state.destroy();
  return copy;
}

// The header line is the only thing left up top: it says which data is loaded,
// which the panels themselves do not.
function cards(s) {
  document.querySelector(".sub").textContent =
    `${s.start} → ${s.end} UTC · 3 rings × 8 thermistors`;
}

function recentTable() {
  const t = JSON.parse(py.runPython("recent_table(5)"));
  if (!t.rows.length) return;
  const head = "<tr>" + t.cols.map((c) => `<th>${c}</th>`).join("") + "</tr>";
  const body = t.rows.map((r) => "<tr>" + r.map((v, i) => {
    const cls = v === "\u2014" ? ' class="na"'
              : (i === r.length - 1 && v !== "clean") ? ' class="flag"' : "";
    return `<td${cls}>${v}</td>`;
  }).join("") + "</tr>").join("");
  $("recent-cap").textContent =
    `Latest 5 of ${t.n_total.toLocaleString()} readings — most recent ${t.latest} UTC`;
  $("recent-tbl").innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
  $("recent").hidden = false;
}

function draw() {
  py.globals.set("mode", mode);
  const meta = JSON.parse(py.runPython("prepare(mode)"));
  const spec = JSON.parse(py.runPython("layout_spec(mode)"));
  const X = grab("X");
  const Y = grab("Y");
  const n = meta.n;
  // Only the ring traces come out of WASM memory. The flow panels carry one
  // point per pulse, so their data arrives inline in the spec.
  const data = spec.traces.map((tr, i) =>
    i < spec.n_ring_traces ? { ...tr, x: X, y: Y.subarray(i * n, (i + 1) * n) } : tr);
  Plotly.react($("plot"), data, spec.layout, { displaylogo: false, responsive: true });

  // Geometry key. Rendered once per data load, not per redraw: it does not
  // depend on the raw/spread toggle.
  const probe = JSON.parse(py.runPython("probe_spec()"));
  $("probe-wrap").hidden = false;
  Plotly.react($("probe"), probe.data, probe.layout,
               { displaylogo: false, responsive: true });

  recentTable();
}

const API = "https://api.rriv.org/data/readings/ac1f09fffe1a8575"
          + "?rangeStart=2026-07-30&format=csv";

function stamp(s, origin) {
  $("stamp").textContent = `${s.start} → ${s.end} UTC · ${origin}`;
}

// The browser refuses any cross-origin response that does not carry an
// Access-Control-Allow-Origin header. That is enforced by the browser, not by
// this page — there is no flag JS can set to skip it. So a failure here is
// reported rather than worked around, and the bundled snapshot stays on screen.
async function refresh(quiet) {
  if (!loaded) return;
  const btn = $("refresh");
  btn.disabled = true;
  if (!quiet) say("Fetching from api.rriv.org…");
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    py.globals.set("csv_text", text);
    const s = JSON.parse(py.runPython("load_csv(csv_text)"));
    cards(s);
    draw();
    stamp(s, "live from API");
    say("");
  } catch (err) {
    if (!quiet) {
      say("Browser blocked the API request — api.rriv.org sends no "
        + "Access-Control-Allow-Origin header. Showing the bundled snapshot.", true);
    }
  } finally {
    btn.disabled = false;
  }
}

$("refresh").onclick = () => refresh(false);

for (const [id, m] of [["m-raw", "raw"], ["m-spread", "spread"]]) {
  $(id).onclick = () => {
    if (!loaded || mode === m) return;
    mode = m;
    $("m-raw").classList.toggle("on", m === "raw");
    $("m-spread").classList.toggle("on", m === "spread");
    draw();
  };
}

boot();
</script>
</body>
</html>
